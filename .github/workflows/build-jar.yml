name: Build jar

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The jar bundles the web editor only if editor/dist exists.
      - name: Build web editor
        run: cd editor && npm ci && npm run build
      - name: Build
        run: |
          # gradle.properties may pin a local JDK path; CI uses the runner's JDK 21.
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: '**/build/libs/*.jar'
          if-no-files-found: error
      # Publishes the jars to the jars branch so the Skylore pack build can fetch them with git.
      - name: Publish jars to the jars branch
        run: |
          set -e
          mkdir /tmp/jars
          find . -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} /tmp/jars/ \;
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin jars || true
          if git rev-parse --verify -q origin/jars >/dev/null; then git checkout -B jars origin/jars; else git checkout --orphan jars; git rm -rfq .; fi
          git clean -fdxq
          mkdir -p "$GITHUB_REF_NAME" && rm -f "$GITHUB_REF_NAME"/*.jar && cp /tmp/jars/*.jar "$GITHUB_REF_NAME"/
          echo "${GITHUB_SHA}" > "$GITHUB_REF_NAME"/COMMIT
          git add -A
          git commit -qm "Jars from ${GITHUB_SHA::7} on $GITHUB_REF_NAME" || exit 0
          git push origin jars
