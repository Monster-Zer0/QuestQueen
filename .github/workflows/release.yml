name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (markdown)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web editor
        run: cd editor && npm ci && npm run build
      - name: Build
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          chmod +x gradlew
          ./gradlew build --no-daemon
      # Tags the built commit v<mod_version> and attaches the jar, with its checksum under the notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jar=build/libs/questqueen-$version-all.jar
          printf '%s\n\n`%s` sha256 `%s`\n' "$NOTES" "$(basename "$jar")" "$(sha256sum "$jar" | cut -d' ' -f1)" > notes.md
          gh release create "v$version" "$jar" --target "$GITHUB_SHA" --title "QuestQueen $version" --notes-file notes.md
