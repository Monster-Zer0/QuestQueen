plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets {
    dev
}

// Harness JSON is a second source set of this same mod, so runClient/runServer load it
// and the published jar (main only) does not.
afterEvaluate {
    def runnable = sourceSets.dev.extensions.findByType(net.neoforged.gradle.dsl.common.extensions.sourceset.RunnableSourceSet)
    if (runnable == null) {
        throw new GradleException("dev source set has no NeoGradle mod identifier; harness chapters would not load in runClient")
    }
    runnable.modIdentifier.set(mod_id)
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Register the sources jar so the published artifact set is not just the binary.
java.withSourcesJar()

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        // Harness chapters live in src/dev/resources. Runs see them; the published jar does not.
        modSource project.sourceSets.dev
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "org.xerial:sqlite-jdbc:${sqlite_version}"
    // PIN, not a range. sqlite-jdbc ships a JNI native library inside the mod jar, so the build must only
    // ever resolve the one version whose sha256 is recorded in gradle/verification-metadata.xml.
    // The coordinate is a static version; `strictly` restates the exact bound for Gradle resolution; and
    // the jar-in-jar negotiation range stays exact (`[x]` is NeoGradle's documented single-version form —
    // "specify the same version for both bounds" — and changing it to an open range would change the
    // runtime semantics of the shipped jar).
    jarJar(implementation("org.xerial:sqlite-jdbc:${sqlite_version}")) {
        version {
            strictly "[${sqlite_version}]"
            prefer sqlite_version
        }
    }
    testImplementation sourceSets.dev.output
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_issue_tracker      : (project.hasProperty('mod_issue_tracker') ? mod_issue_tracker : ''),
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
        // Drop metadata fields whose property is unset rather than shipping an empty value: a release must
        // not advertise a logo or tracker that is not there. Returning null from the filter deletes the line.
        filter { String line ->
            line.trim().matches('(logoFile|issueTrackerURL)\\s*=\\s*""') ? null : line
        }
    }
    if (file('editor/dist').exists()) {
        from('editor/dist') {
            into 'assets/questqueen/web'
        }
    }
    // The packaged jar carried only MANIFEST.MF, neoforge.mods.toml and jarjar/** — the repo LICENSE never
    // reached it. A missing in-jar licence is one of the most common automated-rejection reasons on the mod
    // platforms, so ship it at META-INF/LICENSE where both of them look for it.
    if (file('LICENSE').exists()) {
        from('LICENSE') {
            into 'META-INF'
        }
    }
}

// ---------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------
// The previous block published `components.java` on its own. For a NeoForge mod that is the thin class jar —
// not the reobfuscated, jarJar-combined "-all" artifact that actually gets deployed — and its artifactId
// defaulted to the directory name, with a POM carrying no name, description, licence or developer. Anything
// resolving dev.aof.questqueen:questqueen got an artifact that would not load.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = mod_group_id
            artifactId = mod_id
            version = mod_version
            // The deployable artifact is the jarJar-combined "-all" jar, not the thin classes jar.
            artifact tasks.named('jarJar')
            artifact tasks.named('sourcesJar')
            pom {
                name = mod_name
                description = 'A pixel-grid quest book with datapack chapters, team progress, and a browser quest editor.'
                licenses {
                    license {
                        name = mod_license
                    }
                }
                developers {
                    developer {
                        name = mod_authors
                    }
                }
                // Only advertise a tracker that exists; see gradle.properties mod_issue_tracker.
                if (project.hasProperty('mod_issue_tracker') && mod_issue_tracker) {
                    url = mod_issue_tracker
                }
            }
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
